name: reproduce

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Reproduce published results (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Run the regression suite
        run: pytest -q

      - name: Regenerate all tables and figures
        run: genai-competency --data data/arabic_genai_competency_data.csv --outdir output

      - name: Upload regenerated output
        uses: actions/upload-artifact@v4
        with:
          name: reproduction-output-py${{ matrix.python-version }}
          path: output/
