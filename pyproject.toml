[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-competency"
version = "1.0.0"
description = "Reproduction package for a four-dimensional measure of generative-AI competency among Arabic language and literature students"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Fayez Sobhy Abdelsalam Torky", email = "f.torky@squ.edu.om" },
  { name = "Khaled Suleiman Muhanna Al Kindi", email = "abuqasim@squ.edu.om" },
  { name = "Mohamed Mostafa Ali Hassanein", email = "m.hassanein@squ.edu.om" },
]
keywords = ["AI literacy", "psychometrics", "Arabic", "higher education", "reproducibility"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "pingouin>=0.5",
  "factor_analyzer>=0.5",
  "matplotlib>=3.7",
  "scikit-learn>=1.3,<1.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
genai-competency = "genai_competency.cli:main"

[project.urls]
Repository = "https://github.com/rabieramadan/arabic-genai-competency"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "E702"]  # E702: paired assignments kept on one line in pipeline.py
